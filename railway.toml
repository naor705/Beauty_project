[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npx tsx src/scheduler/index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Mount a persistent volume at /data so the SQLite DB survives redeploys.
# Configure the volume in the Railway dashboard: Service → Settings → Volumes.
#   Mount path: /data
#   Size: 1 GB is plenty for the MVP.
